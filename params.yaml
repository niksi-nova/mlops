train:
  experiment_name: ttc-delay-baselines
  log_target: true
  random_state: 42
  ridge:
    alpha: 1.0
  random_forest:
    n_estimators: 200
    max_depth: 20
    min_samples_leaf: 5
  lightgbm:
    n_estimators: 2000
    learning_rate: 0.05
    num_leaves: 63
    min_child_samples: 50
    subsample: 0.8
    colsample_bytree: 0.8
    early_stopping_rounds: 100
  lightgbm_l1:
    n_estimators: 2000
    learning_rate: 0.05
    num_leaves: 63
    min_child_samples: 50
    subsample: 0.8
    colsample_bytree: 0.8
    early_stopping_rounds: 100
    objective: l1

data:
  city: Delhi
  timezone: Asia/Kolkata
  source_url: https://github.com/bus-data/bus-data.github.io/raw/master/asset/dataset.zip
  months_included: [1, 2, 3]

clean:
  trip_gap_minutes: 30        # same vehicle idle longer than this = new trip
  min_nodes_per_trip: 5       # drop trips with fewer recorded stops

segments:
  max_segment_seconds: 1800   # drop segments longer than 30 min (recording errors)
  min_segment_seconds: 1      # drop zero/negative times
