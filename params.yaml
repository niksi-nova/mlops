train:
  wandb_project: delhi-bus-delay
  target: travel_time_s
  random_state: 42
  success_target_pct: 10
  ridge:
    alpha: 1.0
  random_forest:
    n_estimators: 200
    max_depth: 20
    min_samples_leaf: 5
  lightgbm_l2:
    n_estimators: 3000
    learning_rate: 0.05
    num_leaves: 63
    min_child_samples: 50
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    early_stopping_rounds: 100
  lightgbm_l1:
    # Tuned via W&B sweep 7rcgds9b, best run sgvxdy1i (val_mae 29.321,
    # vs 29.434 for the untuned defaults) - see sweeps/lightgbm_l1_sweep.yaml.
    n_estimators: 3000
    learning_rate: 0.02217
    num_leaves: 255
    min_child_samples: 50
    subsample: 0.879
    subsample_freq: 1
    colsample_bytree: 0.829
    reg_lambda: 0.0265
    early_stopping_rounds: 100
    objective: l1

data:
  city: Delhi
  timezone: Asia/Kolkata
  source_url: https://github.com/bus-data/bus-data.github.io/raw/master/asset/dataset.zip
  months_included: [1, 2, 3]

clean:
  trip_gap_minutes: 30        # same vehicle idle longer than this = new trip
  min_nodes_per_trip: 5       # drop trips with fewer recorded stops

segments:
  max_segment_seconds: 1800   # drop segments longer than 30 min (recording errors)
  min_segment_seconds: 1      # drop zero/negative times

featurize:
  train_days: [1, 61]
  val_days: [62, 76]
  test_days: [77, 92]
  peak_am: [8, 10]
  peak_pm: [17, 20]
  prev_n_buses: 3
  recent_window_minutes: 30
  te_folds: 5
  rare_vehicle_min_count: 500
