# W&B sweep config for the lightgbm_l1 model.
#
# NOT run automatically - the person running it should do:
#   uv run wandb sweep sweeps/lightgbm_l1_sweep.yaml
#   uv run wandb agent <sweep_id>
#
# Runs as a module (src.models.sweep_train), not as a bare script path, so
# `import src...` resolves correctly from the project root. project: must
# match params.yaml's train.wandb_project.

program: src/models/sweep_train.py
project: delhi-bus-delay
method: bayes
metric:
  name: val_mae
  goal: minimize
early_terminate:
  type: hyperband
  min_iter: 3
parameters:
  num_leaves:
    values: [31, 63, 127, 255]
  learning_rate:
    distribution: log_uniform_values
    min: 0.01
    max: 0.2
  min_child_samples:
    values: [20, 50, 100, 200]
  colsample_bytree:
    distribution: uniform
    min: 0.5
    max: 1.0
  subsample:
    distribution: uniform
    min: 0.5
    max: 1.0
  reg_lambda:
    distribution: log_uniform_values
    min: 0.001
    max: 10
command:
  - ${env}
  - ${interpreter}
  - -m
  - src.models.sweep_train
