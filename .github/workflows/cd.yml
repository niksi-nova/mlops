name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: niksi-nova/mlops

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image_ref: ${{ steps.image_ref.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0 # no moving major tag exists past v7; pin exact version
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Configure DVC remote credentials
        env:
          DAGSHUB_USER: ${{ secrets.DAGSHUB_USER }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          uv run dvc remote modify --local origin access_key_id "$DAGSHUB_USER"
          uv run dvc remote modify --local origin secret_access_key "$DAGSHUB_TOKEN"

      - name: Pull the data the image build needs
        # The Dockerfile COPYs data/processed/feature_spec.json (DVC-tracked,
        # not in git), but a plain checkout never has it on disk. Without
        # this pull, `docker build` fails with "not found" on that path.
        # No model .joblib is pulled here: the image loads the model at
        # container runtime (MODEL_ALIAS from the registry, or a mounted
        # MODEL_PATH), never at build time.
        run: uv run dvc pull data/processed/feature_spec.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.sha }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compute this run's image reference
        id: image_ref
        # Read the actual sha-* tag out of metadata-action's own JSON output
        # rather than recomputing the "sha-<7 chars>" format independently -
        # if metadata-action's tag format or short-SHA length ever changes,
        # a hand-rolled recomputation would silently stop matching what was
        # actually pushed, and the deploy job would tell Render to pull a
        # tag that doesn't exist.
        run: |
          tag="$(echo '${{ steps.meta.outputs.json }}' | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          sha_tags = [t for t in data['tags'] if ':sha-' in t]
          if not sha_tags:
              sys.exit('no sha-* tag found in metadata-action output: ' + repr(data['tags']))
          print(sha_tags[0])
          ")"
          echo "value=${tag}" >> "$GITHUB_OUTPUT"

      - name: Write job summary
        run: |
          {
            echo "### Image published"
            echo
            echo "- Tags: \`${{ steps.meta.outputs.tags }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check deploy configuration
        id: check
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK }}" ] || [ -z "${{ vars.RENDER_URL }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deploy: repository secret RENDER_DEPLOY_HOOK or repository variable RENDER_URL is not set."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
          # Normalize once (strip a trailing slash) so every later step uses
          # the same URL shape, instead of each curl call re-deriving it.
          echo "render_url=$(echo '${{ vars.RENDER_URL }}' | sed 's:/*$::')" >> "$GITHUB_OUTPUT"

      - name: Trigger Render deploy hook
        id: trigger
        if: steps.check.outputs.configured == 'true'
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          IMAGE_REF: ${{ needs.build-and-push.outputs.image_ref }}
        run: |
          set +x
          # Render deploy hooks for image-backed services accept an imgURL
          # query parameter to deploy a specific tag/digest instead of the
          # service's default image reference (see
          # https://render.com/docs/deploy-hooks). Render's docs don't show
          # a fully worked encoded example, so this uses standard percent-
          # encoding of the complete image reference. The hook URL may
          # already carry its own "key" query parameter, so append with
          # "&" if a "?" is already present, "?" otherwise. The hook URL
          # itself is never echoed or logged - only the HTTP status is.
          encoded_img="$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$IMAGE_REF")"
          case "$RENDER_DEPLOY_HOOK" in
            *"?"*) sep="&" ;;
            *) sep="?" ;;
          esac
          full_url="${RENDER_DEPLOY_HOOK}${sep}imgURL=${encoded_img}"
          status=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 20 -X POST "$full_url")
          curl_exit=$?
          echo "Render deploy hook HTTP status: $status (curl exit code: $curl_exit)"
          if [ "$curl_exit" -ne 0 ]; then
            echo "::error::Render deploy hook call failed (curl exit code $curl_exit) - hook URL unreachable, timed out, or malformed. Never logging the URL itself; verify the RENDER_DEPLOY_HOOK secret directly in Render's dashboard."
            exit 1
          fi
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Render deploy hook rejected the request: HTTP $status."
            exit 1
          fi

      - name: Poll Render for the new deploy to come up healthy
        id: poll
        if: steps.check.outputs.configured == 'true'
        env:
          RENDER_URL: ${{ steps.check.outputs.render_url }}
        run: |
          # A sleeping free-tier instance takes about a minute to wake up;
          # poll for up to 12 minutes total. Every curl call is individually
          # time-bounded so a stalled connection can never hold this loop
          # (or the job) open past that budget.
          deadline=$((SECONDS + 720))
          attempt=0
          outcome="timeout"
          last_body=""
          while [ "$SECONDS" -lt "$deadline" ]; do
            attempt=$((attempt + 1))
            http_status=$(curl -s -o /tmp/health_body.json -w "%{http_code}" \
              --connect-timeout 10 --max-time 20 "${RENDER_URL}/health")
            curl_exit=$?
            body="$(cat /tmp/health_body.json 2>/dev/null || true)"
            last_body="$body"

            if [ "$curl_exit" -ne 0 ]; then
              echo "attempt ${attempt}: curl failed (exit code ${curl_exit}) - unreachable or timed out"
            else
              model_loaded="unknown"
              if echo "$body" | grep -Eq '"model_loaded"[[:space:]]*:[[:space:]]*true'; then
                model_loaded="true"
              elif echo "$body" | grep -Eq '"model_loaded"[[:space:]]*:[[:space:]]*false'; then
                model_loaded="false"
              fi
              echo "attempt ${attempt}: http_status=${http_status} model_loaded=${model_loaded}"

              if [ "$http_status" = "200" ] && [ "$model_loaded" = "true" ]; then
                outcome="healthy"
                break
              fi
            fi
            sleep 15
          done

          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
          if [ "$outcome" != "healthy" ]; then
            echo "::error::Render never came up healthy within 12 minutes. Last response body: $last_body"
            if echo "$last_body" | grep -q "load_error"; then
              echo "::error::The service IS responding but the model failed to load - see the load_error field above (and Render's own logs for the full WARNING lines)."
            elif [ -z "$last_body" ]; then
              echo "::error::No response body at all - check RENDER_URL is correct (scheme + host, e.g. https://your-service.onrender.com) and that the service exists."
            fi
            exit 1
          fi

      - name: Write job summary
        if: always()
        env:
          RENDER_URL: ${{ steps.check.outputs.render_url }}
        run: |
          {
            echo "### Deploy"
            if [ "${{ steps.check.outputs.configured }}" != "true" ]; then
              echo "Skipped: RENDER_DEPLOY_HOOK secret or RENDER_URL repository variable is not set."
            else
              echo "- Live URL: ${RENDER_URL}"
              echo "- Image deployed: \`${{ needs.build-and-push.outputs.image_ref }}\`"
              echo "- Health result: ${{ steps.poll.outputs.outcome == 'healthy' && 'healthy (HTTP 200, model_loaded=true)' || 'NOT healthy' }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
