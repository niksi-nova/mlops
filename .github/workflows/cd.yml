name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: niksi-nova/mlops

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0 # no moving major tag exists past v7; pin exact version
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Configure DVC remote credentials
        env:
          DAGSHUB_USER: ${{ secrets.DAGSHUB_USER }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          uv run dvc remote modify --local origin access_key_id "$DAGSHUB_USER"
          uv run dvc remote modify --local origin secret_access_key "$DAGSHUB_TOKEN"

      - name: Pull the data the image build needs
        # The Dockerfile COPYs data/processed/feature_spec.json (DVC-tracked,
        # not in git), but a plain checkout never has it on disk. Without
        # this pull, `docker build` fails with "not found" on that path.
        # No model .joblib is pulled here: the image loads the model at
        # container runtime (MODEL_ALIAS from the registry, or a mounted
        # MODEL_PATH), never at build time.
        run: uv run dvc pull data/processed/feature_spec.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.sha }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write job summary
        run: |
          {
            echo "### Image published"
            echo
            echo "- Tags: \`${{ steps.meta.outputs.tags }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
