stages:
  clean:
    cmd: uv run python src/data/clean.py
    deps:
      - data/raw/historical
      - src/data/clean.py
    params:
      - clean
    outs:
      - data/interim/historical_clean.parquet
    metrics:
      - reports/cleaning_report.json:
          cache: false

  validate:
    cmd: uv run python src/data/validate.py
    deps:
      - data/interim/historical_clean.parquet
      - src/data/validate.py
    metrics:
      - reports/validation_report.json:
          cache: false

  fetch_weather:
    cmd: uv run python src/data/fetch_weather.py
    deps:
      - src/data/fetch_weather.py
      - data/interim/historical_clean.parquet
    params:
      - weather
    outs:
      - data/external/weather_hourly.parquet

  merge:
    cmd: uv run python src/data/merge.py
    deps:
      - data/interim/historical_clean.parquet
      - data/external/weather_hourly.parquet
      - reports/validation_report.json
      - src/data/merge.py
    outs:
      - data/interim/merged.parquet
    metrics:
      - reports/merge_report.json:
          cache: false
