stages:
  clean:
    cmd: uv run python -m src.data.clean
    deps:
      - data/raw/delhi_gps
      - src/data/clean.py
    params:
      - clean
    outs:
      - data/interim/stop_events.parquet
    metrics:
      - reports/cleaning_report.json:
          cache: false

  build_segments:
    cmd: uv run python -m src.data.build_segments
    deps:
      - data/interim/stop_events.parquet
      - src/data/build_segments.py
    params:
      - segments
    outs:
      - data/interim/segments.parquet
    metrics:
      - reports/segments_report.json:
          cache: false

  validate:
    cmd: uv run python -m src.data.validate
    deps:
      - data/interim/segments.parquet
      - src/data/validate.py
    params:
      - segments
    metrics:
      - reports/validation_report.json:
          cache: false

  featurize:
    cmd: uv run python -m src.features.build_features
    deps:
      - data/interim/segments.parquet
      - reports/validation_report.json
      - src/features/build_features.py
      - src/features/time_features.py
    params:
      - featurize
    outs:
      - data/processed/train.parquet
      - data/processed/val.parquet
      - data/processed/test.parquet
      - data/processed/feature_spec.json
    metrics:
      - reports/featurize_report.json:
          cache: false

  train:
    cmd: uv run python -m src.models.train
    deps:
      - data/processed/train.parquet
      - data/processed/val.parquet
      - data/processed/feature_spec.json
      - src/models/train.py
      - src/models/tracking.py
      - src/models/baselines.py
    params:
      - train
    outs:
      - models/
    metrics:
      - reports/train_metrics.json:
          cache: false
