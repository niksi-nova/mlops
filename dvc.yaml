stages:
  clean:
    cmd: uv run python src/data/clean.py
    deps:
      - data/raw/historical
      - src/data/clean.py
    params:
      - clean
    outs:
      - data/interim/historical_clean.parquet
    metrics:
      - reports/cleaning_report.json:
          cache: false

  validate:
    cmd: uv run python src/data/validate.py
    deps:
      - data/interim/historical_clean.parquet
      - src/data/validate.py
    metrics:
      - reports/validation_report.json:
          cache: false

  fetch_weather:
    cmd: uv run python src/data/fetch_weather.py
    deps:
      - src/data/fetch_weather.py
      - data/interim/historical_clean.parquet
    params:
      - weather
    outs:
      - data/external/weather_hourly.parquet

  merge:
    cmd: uv run python src/data/merge.py
    deps:
      - data/interim/historical_clean.parquet
      - data/external/weather_hourly.parquet
      - reports/validation_report.json
      - src/data/merge.py
    outs:
      - data/interim/merged.parquet
    metrics:
      - reports/merge_report.json:
          cache: false

  featurize:
    cmd: uv run python -m src.features.build_features
    deps:
      - data/interim/merged.parquet
      - src/features/build_features.py
      - src/features/time_features.py
    params:
      - featurize
    outs:
      - data/processed/train.parquet
      - data/processed/val.parquet
      - data/processed/test.parquet
      - data/processed/feature_spec.json
    metrics:
      - reports/featurize_report.json:
          cache: false

  train:
    cmd: uv run python -c "from src.models.train import main; main()"
    deps:
      - data/processed/train.parquet
      - data/processed/val.parquet
      - data/processed/feature_spec.json
      - src/models/train.py
      - src/models/tracking.py
    params:
      - train
    outs:
      - models/
    metrics:
      - reports/train_metrics.json:
          cache: false

  evaluate:
    cmd: uv run python -c "from src.models.evaluate import main; main()"
    deps:
      - data/processed/test.parquet
      - data/processed/feature_spec.json
      - models/
      - src/models/evaluate.py
    metrics:
      - reports/test_metrics.json:
          cache: false
    plots:
      - reports/figures/eval/
